<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulseGlow {
          0%, 100% {
            box-shadow: 0 0 15px rgba(185, 28, 28, 0.2), inset 0 0 15px rgba(185, 28, 28, 0.1);
          }
          50% {
            box-shadow: 0 0 30px rgba(185, 28, 28, 0.5), inset 0 0 20px rgba(185, 28, 28, 0.25);
          }
        }

        .glow-circle {
          animation: pulseGlow 4s infinite ease-in-out;
      }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NightOwls Focus Timer</title>
</head>
<body class="bg-[#0b0c10] text-slate-100 flex flex-col items-center justify-center min-h-screen p-6">
    <header class="text-center mb-8">
        <h1 class="text-4xl font-extrabold text-red-700 tracking-wider">NightOwls Focus Timer</h1>
        <p class="text-slate-400 text-sm mt-1 font-bold">Late night productivity tracker</p>
    </header>
    <div class="bg-[#121318] border-2 border-red-900/40 shadow-lg rounded-full w-64 h-64 flex items-center justify-center my-6 transition-all duration-300 glow-circle">
        <h2 class="text-6xl font-bold text-red-600 tracking-widest">25:00</h2>
    </div>
    <div class="flex gap-4 mb-8">
        <button id="startBtn" class="bg-red-800 hover:bg-red-700 text-white font-semibold px-6 py-2.5 rounded-xl border border-red-700 transition">Start</button>
        <button id="pauseBtn" class="bg-slate-900 hover:bg-slate-800 text-amber-500 font-semibold px-6 py-2.5 rounded-xl border border-slate-800 transition">Pause</button>
        <button id="resetBtn" class="bg-slate-900 hover:bg-slate-800 text-red-400 font-semibold px-6 py-2.5 rounded-xl border border-slate-800 transition">Reset</button>
    </div>
    <div class="bg-[#121318] border border-slate-800 p-4 rounded-2xl flex gap-6 mb-6">
        <div class="flex flex-col gap-1">
            <label class="text-sm font-semibold text-slate-300">Focus Time (min):</label>
            <input id="focusInput" type="number" step="any" value="25" class="bg-[#0b0c10] border border-slate-800 text-slate-200 px-2 py-1 rounded">
        </div>
        <div class="flex flex-col gap-1">
            <label class="text-sm font-semibold text-slate-300">Break Time (min):</label>
            <input id="breakInput" type="number" step="any" value="5" class="bg-[#0b0c10] border border-slate-800 text-slate-200 px-2 py-1 rounded">
        </div>
    </div>
    <div class="bg-[#121318] border border-slate-800 p-4 rounded-2xl flex flex-col gap-2 w-full max-w-sm mb-6">
        <label class="text-sm font-semibold text-slate-300">Current Task:</label>
        <div class="flex gap-2">
            <input type="text" id="taskInput" placeholder="What are you working on?" class="bg-[#0b0c10] border border-slate-800 text-slate-200 px-3 py-2 rounded-lg text-sm focus:outline-none focus:border-red-700 w-full">
            <button id="addTaskBtn" class="bg-red-800 hover:bg-red-700 text-white px-3 py-2 text-xs rounded-lg font-semibold transition">Add</button>
        </div>
        <ul id="taskList" class="flex flex-col gap-1 mt-2 text-xs text-slate-300"></ul>
    </div>
    <div class="flex gap-2 mb-6">
        <button id="preset15" class="bg-[#121318] hover:bg-slate-800 border border-slate-800 text-slate-400 text-xs px-3 py-1.5 rounded-lg transition">15 Min (Quick)</button>
        <button id="preset25" class="bg-[#121318] hover:bg-slate-800 border border-slate-800 text-slate-400 text-xs px-3 py-1.5 rounded-lg transition">25 Min (Pomodoro)</button>
        <button id="preset45" class="bg-[#121318] hover:bg-slate-800 border border-slate-800 text-slate-400 text-xs px-3 py-1.5 rounded-lg transition">45 Min (Deep Focus)</button>
    </div>
    <div class="bg-[#121318]/70 border border-slate-800 p-4 rounded-2xl w-full max-w-sm text-center">
        <h3 class="text-xs text-slate-400 uppercase tracking-widest font-semibold mb-2">Tonight's Progress</h3>
        <div class="flex justify-around text-sm">
            <p class="text-slate-300">Completed Tasks: <span id="doneCount" class="text-red-500 font-bold">0</span></p>
            <p class="text-slate-300">Total Focus Time: <span id="focusHours" class="text-red-500 font-bold">0 hrs</span></p>
        </div>
    </div>
    <script>
        const displayClock = document.querySelector('h2');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');

        const focusInput = document.getElementById('focusInput');
        const breakInput = document.getElementById('breakInput');

        const focusHoursSpan = document.getElementById('focusHours');

        let secsLeft = 25 * 60;
        let timerId = null;
        let isBreakMode = false;
        let accumulatedMins = 0;

        function updateDisplay() {
            let mins = Math.floor(secsLeft / 60);
            let secs = Math.round(secsLeft % 60);
            if (secs === 60) {
                mins += 1;
                secs = 0;
            }
            const minsFormatted = mins < 10 ? '0' + mins : mins;
            const secsFormatted = secs < 10 ? '0' + secs : secs;
            displayClock.textContent = minsFormatted + ':' + secsFormatted;
        }

        startBtn.addEventListener('click', function() {
            if (timerId !== null) return;
            timerId = setInterval(function() {
                if (secsLeft > 0) {
                    secsLeft--;
                    updateDisplay();
                } else {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    osc.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.5);

                    if (!isBreakMode) {
                        const minsAdded = parseFloat(focusInput.value) || 25;
                        accumulatedMins += minsAdded;
                        focusHoursSpan.textContent = (accumulatedMins / 60).toFixed(2) + ' hrs';

                        alert('Focus session done! Time for a break.');
                        isBreakMode = true;
                        secsLeft = (parseFloat(breakInput.value) || 5) * 60;
                    } else {
                        alert('Break time over! Back to work.');
                        isBreakMode = false;
                        secsLeft = (parseFloat(focusInput.value) || 25) * 60;
                    }
                    updateDisplay();
                    clearInterval(timerId);
                    timerId = null;
                }
            }, 1000);
        });

        pauseBtn.addEventListener('click', function() {
            clearInterval(timerId);
            timerId = null;
        });

        resetBtn.addEventListener('click', function() {
            clearInterval(timerId);
            timerId = null;
            isBreakMode = false;
            secsLeft = (parseFloat(focusInput.value) || 25) * 60;
            updateDisplay();
        });

        focusInput.addEventListener('change', function() {
            if (!isBreakMode) {
                secsLeft = (parseFloat(focusInput.value) || 1) * 60;
                updateDisplay();
            }
        });

        breakInput.addEventListener('change', function() {
            if (isBreakMode) {
                secsLeft = (parseFloat(breakInput.value) || 1) * 60;
                updateDisplay();
            }
        });

        document.getElementById('preset15').onclick = () => { focusInput.value = 15; isBreakMode = false; secsLeft = 15 * 60; updateDisplay(); };
        document.getElementById('preset25').onclick = () => { focusInput.value = 25; isBreakMode = false; secsLeft = 25 * 60; updateDisplay(); };
        document.getElementById('preset45').onclick = () => { focusInput.value = 45; isBreakMode = false; secsLeft = 45 * 60; updateDisplay(); };

        const taskInput = document.getElementById('taskInput');
        const addTaskBtn = document.getElementById('addTaskBtn');
        const taskList = document.getElementById('taskList');
        const doneCountSpan = document.getElementById('doneCount');

        let tasksDoneCount = 0;

        if (addTaskBtn) {
            addTaskBtn.onclick = function() {
                const text = taskInput.value.trim();
                if (!text) return;

                const li = document.createElement('li');
                li.className = 'flex justify-between items-center bg-[#0b0c10] border border-slate-800 p-2 rounded';
                li.innerHTML = '<span>' + text + '</span><button class="bg-red-800 hover:bg-red-700 text-xs text-white px-1.5 py-0.5 rounded">✔</button>';

                const checkBtn = li.querySelector('button');
                checkBtn.onclick = function() {
                    li.classList.add('line-through', 'text-slate-600');
                    checkBtn.remove();
                    tasksDoneCount++;
                    doneCountSpan.textContent = tasksDoneCount;
                };

                taskList.appendChild(li);
                taskInput.value = '';
            };
        }
    </script>
</body>
</html>
