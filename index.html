<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1 class="main-title">NightOwls Focus Timer</h1>
            <p>Late night study tracker</p>
        </header>
        <div class="timer-display">
            <span id="timerDisp">25:00</span>
        </div>
        <div class="btn-row">
            <button id="startBtn" class="btn">Start</button>
            <button id="pauseBtn" class="btn">Pause</button>
            <button id="resetBtn" class="btn">Reset</button>
        </div>
        <div class="box">
            <div class="field">
                <label>Focus (min):</label>
                <input id="focusInp" type="number" step="any" value="25">
            </div>
            <div class="field">
                <label>Break (min):</label>
                <input id="breakInp" type="number" step="any" value="5">
            </div>
        </div>
        <div class="presets-row">
            <button id="preset15">15 min (Quick)</button>
            <button id="preset25">25 min (Pomodoro)</button>
            <button id="preset45">45 min (Deep Focus)</button>
        </div>
        <div class="box">
            <label>Current Task:</label>
            <div class="task-input-row">
                <input type="text" id="taskInp" placeholder="What are you working on?">
                <button id="addTaskBtn" class="btn btn-add">Add</button>
            </div>
            <ul id="taskList"></ul>
        </div>
        <div class="box stats">
            <p>Total Tasks: <span id="doneCount">0</span> | Focus Time: <span id="focusHrs">0 hrs</span></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
