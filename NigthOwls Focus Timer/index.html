<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NightOwls Focus Timer</title>
</head>
<body>
    <header>
        <h1>NightOwls Focus Timer</h1>
        <p>Late night productivity time</p>
    </header>
    <div>
        <h2>25:00</h2>
    </div>
    <div>
        <button>Start</button>
        <button>Pause</button>
        <button>Reset</button>
    </div>
    <div>
        <label>Focus Time (min):</label>
        <input type="number" value="25">
        <label>Break Time (min):</label>
        <input type="number" value="5">
    </div>
    <div>
        <label>Current Task:</label>
        <input type="text" placeholder="What are you working on?">
    </div>
</body>
</html>
