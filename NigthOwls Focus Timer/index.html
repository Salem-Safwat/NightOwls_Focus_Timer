<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulseGlow {
          0%, 100% {
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.2), inset 0 0 15px rgba(99, 102, 241, 0.1);
          }
          50% {
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.5), inset 0 0 20px rgba(99, 102, 241, 0.25);
          }
        }

        .glow-circle {
         animation: pulseGlow 4s infinite ease-in-out;
      }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NightOwls Focus Timer</title>
</head>
<body class="bg-black text-slate-100 flex flex-col items-center justify-center min-h-screen p-6">
    <header class="text-center mb-8">
        <h1 class="text-4xl font-extrabold text-rose-800 tracking-wider">NightOwls Focus Timer</h1>
        <p class="text-slate-400 text-sm mt-1 font-bold">Late night productivity time</p>
    </header>
    <div class="bg-slate-900 border-2 border-indigo-500/30 shadow-lg shadow-indigo-500/10 rounded-full w-64 h-64 flex items-center justify-center my-6 transition-all duration-300 glow-circle">
        <h2 class="text-6xl font-bold text-indigo-300 tracking-widest drop-shadow-[0_0_10px_rgba(99,102,241,0.5)]">25:00</h2>
    </div>
    <div class="flex gap-4 mb-8">
        <button class="bg-rose-700 hover:bg-rose-600 text-white font-semibold px-6 py-2.5 rounded-xl transition">Start</button>
        <button class="bg-slate-800 hover:bg-slate-700 text-amber-400 font-semibold px-6 py-2.5 rounded-xl border border-slate-700 transition">Pause</button>
        <button class="bg-slate-800 hover:bg-slate-700 text-rose-400 font-semibold px-6 py-2.5 rounded-xl border border-slate-700 transition">Reset</button>
    </div>
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex gap-6 mb-6">
        <div class="flex flex-col gap-1">
            <label>Focus Time (min):</label>
            <input type="number" value="25">
        </div>
        <div class="flex flex-col gap-1">
            <label>Break Time (min):</label>
            <input type="number" value="5">
        </div>
    </div>
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex flex-col gap-1 w-full max-w-sm mb-6">
        <label class="text-xs text-slate-400">Current Task:</label>
        <input type="text" placeholder="What are you working on?" class="bg-slate-950 border border-slate-800 text-slate-200 px-3 py-2 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
    </div>
    <div class="gap-2 mb-6">
        <button class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-400 text-xs px-3 py-1.5 rounded-lg transition">15 Min (Quick)</button>
        <button class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-400 text-xs px-3 py-1.5 rounded-lg transition">25 Min (Pomodoro)</button>
        <button class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-400 text-xs px-3 py-1.5 rounded-lg transition">45 Min (Deep Focus)</button>
    </div>
    <div class="bg-slate-900/50 border border-slate-800/80 p-4 rounded-2xl w-full max-w-sm text-center">
        <h3 class="text-xs text-slate-400 uppercase tracking-widest font-semibold mb-2">Tonight's Progress</h3>
        <div class="flex justify-around text-sm">
            <p class="text-slate-300">Completed Tasks: <span class="text-indigo-400 font-bold">0</span></p>
            <p class="text-slate-300">Total Focus Time: <span class="text-indigo-400 font-bold">0 hrs</span></p>
        </div>
    </div>
    <script>
        let timerDisplay = document.querySelector('h2');
        let startBtn = document.querySelectorAll('button')[0];
        let pauseBtn = document.querySelectorAll('button')[1];
        let resetBtn = document.querySelectorAll('button')[2];

        let totalSeconds = 25 * 60;
        let timerInterval = null;

        function updateDisplay() {
            let minutes = Math.floor(totalSeconds / 60);
            let seconds = totalSeconds % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        let breakInput = document.querySelectorAll('input[type=number]')[1];
        let isBreak = false;

        startBtn.addEventListener('click', () => { 
            if (timerInterval !== null) return;
            timerInterval = setInterval(() => {
                if (totalSeconds > 0) {
                    totalSeconds--;
                    updateDisplay();
                } else {
                    let ctx = new(window.AudioContext || window.webkitAudioContext)();
                    let osc = ctx.createOscillator();
                    osc.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.5);

                    if(!isBreak) {
                        alert('Focus session completed! Time for a break.');
                        isBreak = true;
                        totalSeconds = (breakInput.value || 5) * 60;
                        updateDisplay();
                    } else {
                        alert('Break session completed! Back to focus.');
                        isBreak = false;
                        totalSeconds = (focusInput.value || 25) * 60;
                        updateDisplay();
                    }
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
            }, 1000);
        });

        pauseBtn.addEventListener('click', () => {
            clearInterval(timerInterval);
            timerInterval = null;
        });

        resetBtn.addEventListener('click', () => {
            clearInterval(timerInterval);
            timerInterval = null;
            totalSeconds = 25 * 60;
            updateDisplay();
        });
        let focusInput = document.querySelectorAll('input')[0];

        focusInput.addEventListener('change', () => {
            totalSeconds = focusInput.value * 60;
            updateDisplay();
        });
        breakInput.addEventListener('change', () => {
            if (isBreak) {
                totalSeconds = breakInput.value *60;
                updateDisplay();
            }
        });
        let preset15 = document.querySelectorAll('button')[3];
        let preset25 = document.querySelectorAll('button')[4];
        let preset45 = document.querySelectorAll('button')[5];

        preset15.addEventListener('click', () => {
            focusInput.value = 15;
            totalSeconds = 15 * 60;
            updateDisplay();
        });

        preset25.addEventListener('click', () => {
            focusInput.value = 25;
            totalSeconds = 25 * 60;
            updateDisplay();
        });

        preset45.addEventListener('click', () => {
            focusInput.value = 45;
            totalSeconds = 45 * 60;
            updateDisplay();
        });
    </script>
</body>
</html>
